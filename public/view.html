<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình chi tiết</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        .header, .footer {
            margin: 10px;
            font-weight: bold;
        }
        .box {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fff;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: blue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="home.html">Home</a> | <a href="logout.html">Đăng xuất</a>
    </div>

    <div class="container">
        <h2>Màn hình chi tiết</h2>
        <div class="box">
            <p><strong>Username:</strong> test1</p>
            <p><strong>Email:</strong> test1@gmail.com</p>
            <a href="edit.html" class="button">Chỉnh sửa</a>
        </div>
    </div>

    <div class="footer">
        Lập trình web @01/2024
    </div>
</body>
</html>
